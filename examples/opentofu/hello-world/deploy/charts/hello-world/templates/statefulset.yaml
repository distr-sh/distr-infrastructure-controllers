apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "byoc.labels" . | nindent 4 }}
spec:
  # The state allows a single controller. The volume claim outlives the release, so a reinstall with the
  # same release name finds the state again.
  replicas: 1
  serviceName: {{ .Release.Name }}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      {{- include "byoc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include "byoc.secretData" . | sha256sum }}
      labels:
        {{- include "byoc.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      # Time to interrupt OpenTofu and write the state when the pod stops.
      terminationGracePeriodSeconds: 300
      containers:
        - name: opentofu-controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: INSTANCE_NAME
              value: {{ include "byoc.instanceName" . | quote }}
            - name: MODULE_SOURCE
              value: {{ printf "oci://%s?tag=%s" .Values.module.repository (.Values.module.tag | default .Chart.AppVersion) | quote }}
            {{- with .Values.providerMirror }}
            - name: PROVIDER_MIRROR
              value: {{ . | quote }}
            {{- end }}
            - name: APPLY_MODE
              value: {{ .Values.applyMode | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ .Values.reconcileInterval | quote }}
            - name: DATA_DIR
              value: /data
            {{- with .Values.destroyConfirm }}
            - name: DESTROY_CONFIRM
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ toString $value | quote }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ .Release.Name }}
          ports:
            - name: health
              containerPort: 8686
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 10
            failureThreshold: 1
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
