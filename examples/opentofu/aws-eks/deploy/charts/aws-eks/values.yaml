# The OpenTofu controller with the OpenTofu configuration of this example.
image:
  repository: ghcr.io/distr-sh/distr-infrastructure-controllers/opentofu-controller/examples/aws-eks
  # Defaults to the appVersion of the chart.
  tag: ""
  pullPolicy: IfNotPresent

# Installs the providers from OCI repositories below this prefix instead of registry.opentofu.org, such as
# registry.example.com/acme/opentofu-providers. REGISTRY_USERNAME and REGISTRY_PASSWORD in secretEnv
# authenticate at its registry.
providerMirror: ""

# Name of this installation, required. Lowercase letters, digits and hyphens, 3 to 40 characters, starting
# with a letter.
instanceName: ""
# auto applies every plan, plan only logs the changes for a review. Creating a cluster is worth a review.
applyMode: plan
reconcileInterval: 15m
# Set to instanceName to destroy the infrastructure, also with applyMode plan. Uninstall once the logs say so.
# Set variables.database_deletion_protection to false and variables.bucket_force_destroy to true and let them
# apply first.
destroyConfirm: ""
# Encrypts the OpenTofu state and plans, at least 16 characters.
stateEncryptionPassphrase: ""

# Variables of the OpenTofu configuration, passed as TF_VAR_<name>.
variables:
  region: eu-central-1
  # Networks that reach the Kubernetes API, required.
  endpoint_public_access_cidrs: []

# Additional environment variables, and those that belong into a Secret. Without credentials here, the
# controller uses EKS Pod Identity or IRSA of its service account.
env: {}
# secretEnv:
#   AWS_ACCESS_KEY_ID: "{{ .Secrets.AWS_ACCESS_KEY_ID }}"
#   AWS_SECRET_ACCESS_KEY: "{{ .Secrets.AWS_SECRET_ACCESS_KEY }}"
secretEnv: {}

serviceAccount:
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/byoc-opentofu-controller
  annotations: {}
podLabels: {}

# Additional volumes of the pod, such as the certificate authority of a private registry for SSL_CERT_DIR.
extraVolumes: []
extraVolumeMounts: []

# The volume claim holding the state outlives the release.
persistence:
  size: 4Gi
  storageClass: ""

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    memory: 2Gi
