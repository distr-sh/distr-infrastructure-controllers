# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Check mise & renovate config

on:
  push:
    branches:
      - "main"
    paths:
      - "mise.toml"
      - ".github/workflows/mise-renovate.yaml"
      - renovate.json
  pull_request:
    paths:
      - "mise.toml"
      - ".github/workflows/mise-renovate.yaml"
      - renovate.json

jobs:
  install:
    name: Install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Validate renovate.json
        run: mise run lint:renovate-config
