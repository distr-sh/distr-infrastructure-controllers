# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: OpenTofu controller examples

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:

concurrency:
  group: opentofu-controller-examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/opentofu-controller

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Lint OpenTofu
        run: mise run opentofu:lint:tofu
      - name: Lint charts
        run: mise run opentofu:lint:chart

  examples:
    name: Discover examples
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      examples: ${{ steps.discover.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover examples
        id: discover
        run: echo "examples=$(find examples/opentofu -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"

  # Every example is an OpenTofu module package that the controller downloads, tagged with the version.
  module:
    name: Module ${{ matrix.example }}
    needs: [examples, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: oras
      - name: Package module
        run: mise run opentofu:package:module
      - name: Login to GitHub Container Registry (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Push and sign module (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        working-directory: dist/modules
        run: |
          digest=$(oras push --artifact-type application/vnd.opentofu.modulepkg \
            --annotation "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.version=$GITHUB_REF_NAME" \
            --format go-template='{{.digest}}' \
            "$IMAGE/modules/$EXAMPLE:$GITHUB_REF_NAME" "$EXAMPLE.zip:archive/zip")
          cosign sign --yes "$IMAGE/modules/$EXAMPLE@$digest"

  chart:
    name: Chart ${{ matrix.example }}
    needs: [examples, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: helm
      - name: Package chart
        run: helm package "examples/opentofu/$EXAMPLE/deploy/charts/$EXAMPLE"
      - name: Login to GitHub Container Registry (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Push and sign chart (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          # a failing helm push must fail the step even though its output is piped into tee
          set -o pipefail
          helm push "$EXAMPLE-$GITHUB_REF_NAME.tgz" "oci://$IMAGE/charts" 2>&1 | tee push.log
          digest="$(awk '/^Digest: /{print $2}' push.log)"
          cosign sign --yes "$IMAGE/charts/$EXAMPLE@${digest}"

  # The deployments run the controller image of the same version, which the OpenTofu controller
  # workflow pushes, so the versions are only created once that image is in the registry.
  controller-image:
    name: Wait for the OpenTofu controller image
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the image
        run: |
          until docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; do
            echo "Waiting for $IMAGE:$GITHUB_REF_NAME"
            sleep 30
          done

  # One Docker and one Kubernetes application per example in Distr. The repository variable
  # DISTR_APPLICATION_IDS maps each example to them, for example
  # {"hello-world": {"docker": "<application id>", "kubernetes": "<application id>"}}.
  # Examples without an entry are skipped.
  distr:
    name: Distr versions of ${{ matrix.example }}
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [examples, controller-image, module, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    env:
      DOCKER_APPLICATION_ID: ${{ fromJSON(vars.DISTR_APPLICATION_IDS || '{}')[matrix.example].docker }}
      KUBERNETES_APPLICATION_ID: ${{ fromJSON(vars.DISTR_APPLICATION_IDS || '{}')[matrix.example].kubernetes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Distr Docker version
        if: ${{ env.DOCKER_APPLICATION_ID != '' }}
        uses: distr-sh/distr-create-version-action@v1.6.2
        with:
          api-token: ${{ secrets.DISTR_TOKEN }}
          api-base: https://demo.distr.sh/api/v1
          application-id: ${{ env.DOCKER_APPLICATION_ID }}
          version-name: ${{ github.ref_name }}
          compose-file: ${{ github.workspace }}/examples/opentofu/${{ matrix.example }}/deploy/docker/docker-compose.yaml
          template-file: ${{ github.workspace }}/examples/opentofu/${{ matrix.example }}/deploy/docker/env.template
          update-deployments: true
          reuse-deployment-config: true
      - name: Create Distr Kubernetes version
        if: ${{ env.KUBERNETES_APPLICATION_ID != '' }}
        uses: distr-sh/distr-create-version-action@v1.6.2
        with:
          api-token: ${{ secrets.DISTR_TOKEN }}
          api-base: https://demo.distr.sh/api/v1
          application-id: ${{ env.KUBERNETES_APPLICATION_ID }}
          version-name: ${{ github.ref_name }}
          chart-type: oci
          chart-url: oci://${{ env.IMAGE }}/charts/${{ matrix.example }}
          chart-version: ${{ github.ref_name }}
          base-values-file: ${{ github.workspace }}/examples/opentofu/${{ matrix.example }}/deploy/charts/${{ matrix.example }}/values.yaml
