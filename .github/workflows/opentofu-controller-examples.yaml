# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: OpenTofu controller examples

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: opentofu-controller-examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  examples:
    name: Discover examples
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      examples: ${{ steps.discover.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover examples
        id: discover
        run: echo "examples=$(find examples/opentofu -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"

  # The examples are not published. This only checks that the image of every example builds FROM the
  # OpenTofu controller image of this commit.
  image:
    name: Image ${{ matrix.example }}
    needs: [examples]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: |
          docker build --tag opentofu-controller:ci --build-arg VERSION=snapshot --build-arg COMMIT="$GITHUB_SHA" .
          docker build --build-arg CONTROLLER_IMAGE=opentofu-controller:ci --build-arg VERSION=snapshot \
            "examples/opentofu/$EXAMPLE"
