# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: OpenTofu controller examples

on:
  push:
    branches:
      - "main"
    tags:
      - "*"
  pull_request:

concurrency:
  group: opentofu-controller-examples-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/opentofu-controller

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Lint OpenTofu
        run: mise run opentofu:lint:tofu
      - name: Lint charts
        run: mise run opentofu:lint:chart

  examples:
    name: Discover examples
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      examples: ${{ steps.discover.outputs.examples }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover examples
        id: discover
        run: echo "examples=$(find examples/opentofu -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | jq -Rnc '[inputs]')" >>"$GITHUB_OUTPUT"

  # Every example is an image built FROM the OpenTofu controller image of the same version, with the OpenTofu
  # configuration of the example in it. A tag builds it on the pushed controller image, everything else on a
  # controller image built here.
  image:
    name: Image ${{ matrix.example }}
    needs: [examples, lint, controller-image]
    # Without a tag controller-image is skipped, which must not skip this job.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image (no tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          docker build --tag opentofu-controller:ci --build-arg VERSION=snapshot --build-arg COMMIT="$GITHUB_SHA" .
          docker build --build-arg CONTROLLER_IMAGE=opentofu-controller:ci --build-arg VERSION=snapshot \
            "examples/opentofu/$EXAMPLE"
      - name: Login to GitHub Container Registry (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push the image (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: build-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: examples/opentofu/${{ matrix.example }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CONTROLLER_IMAGE=${{ env.IMAGE }}:${{ github.ref_name }}
            VERSION=${{ github.ref_name }}
          sbom: true
          provenance: mode=max
          tags: ${{ env.IMAGE }}/examples/${{ matrix.example }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.description=Distr OpenTofu controller with the ${{ matrix.example }} example
            org.opencontainers.image.vendor=Glasskube
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Sign the image with GitHub OIDC Token (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "$IMAGE/examples/$EXAMPLE@$DIGEST"

  chart:
    name: Chart ${{ matrix.example }}
    needs: [examples, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: helm
      - name: Package chart
        run: helm package "examples/opentofu/$EXAMPLE/deploy/charts/$EXAMPLE"
      - name: Login to GitHub Container Registry (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
      - name: Push and sign chart (tag only)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          # a failing helm push must fail the step even though its output is piped into tee
          set -o pipefail
          helm push "$EXAMPLE-$GITHUB_REF_NAME.tgz" "oci://$IMAGE/charts" 2>&1 | tee push.log
          digest="$(awk '/^Digest: /{print $2}' push.log)"
          cosign sign --yes "$IMAGE/charts/$EXAMPLE@${digest}"

  # The example images are built FROM the controller image of the same version, which the OpenTofu
  # controller workflow pushes, so they are only built once that image is in the registry.
  controller-image:
    name: Wait for the OpenTofu controller image
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Wait for the image
        run: |
          until docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" >/dev/null 2>&1; do
            echo "Waiting for $IMAGE:$GITHUB_REF_NAME"
            sleep 30
          done

  # One Docker and one Kubernetes application per example in Distr. The repository variable
  # DISTR_APPLICATION_IDS maps each example to them, for example
  # {"hello-world": {"docker": "<application id>", "kubernetes": "<application id>"}}.
  # Examples without an entry are skipped.
  distr:
    name: Distr versions of ${{ matrix.example }}
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [examples, image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        example: ${{ fromJSON(needs.examples.outputs.examples) }}
    env:
      DOCKER_APPLICATION_ID: ${{ fromJSON(vars.DISTR_APPLICATION_IDS || '{}')[matrix.example].docker }}
      KUBERNETES_APPLICATION_ID: ${{ fromJSON(vars.DISTR_APPLICATION_IDS || '{}')[matrix.example].kubernetes }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create Distr Docker version
        if: ${{ env.DOCKER_APPLICATION_ID != '' }}
        uses: distr-sh/distr-create-version-action@13a9244a46f3d9019f1e2a6c0063f88908fafff3 # v1.6.2
        with:
          api-token: ${{ secrets.DISTR_TOKEN }}
          api-base: https://demo.distr.sh/api/v1
          application-id: ${{ env.DOCKER_APPLICATION_ID }}
          version-name: ${{ github.ref_name }}
          compose-file: ${{ github.workspace }}/examples/opentofu/${{ matrix.example }}/deploy/docker/docker-compose.yaml
          template-file: ${{ github.workspace }}/examples/opentofu/${{ matrix.example }}/deploy/docker/env.template
          update-deployments: true
          reuse-deployment-config: true
      - name: Create Distr Kubernetes version
        if: ${{ env.KUBERNETES_APPLICATION_ID != '' }}
        uses: distr-sh/distr-create-version-action@13a9244a46f3d9019f1e2a6c0063f88908fafff3 # v1.6.2
        with:
          api-token: ${{ secrets.DISTR_TOKEN }}
          api-base: https://demo.distr.sh/api/v1
          application-id: ${{ env.KUBERNETES_APPLICATION_ID }}
          version-name: ${{ github.ref_name }}
          chart-type: oci
          chart-url: oci://${{ env.IMAGE }}/charts/${{ matrix.example }}
          chart-version: ${{ github.ref_name }}
          base-values-file: ${{ github.workspace }}/examples/opentofu/${{ matrix.example }}/deploy/charts/${{ matrix.example }}/values.yaml
