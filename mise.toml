[settings]
env_shell_expand = false
task.output = "prefix"

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
opentofu = "1.13.1"
tflint = "0.64.0"
helm = "4.3.0"
kubeconform = "0.8.0"
yq = "4.54.1"
osv-scanner = "2.4.0"
oras = "1.3.4"
dprint = "0.61.1"

[env]
_.source = ["hack/current-commit.sh"]
VERSION = "{{ get_env(name='VERSION', default='snapshot') }}"
CGO_ENABLED = "0"
EXAMPLE = "{{ get_env(name='EXAMPLE', default='hello-world') }}"

[vars]
ldflags = "-s -w -X github.com/distr-sh/distr-controller-contrib/internal/buildconfig.version=$VERSION -X github.com/distr-sh/distr-controller-contrib/internal/buildconfig.commit=$COMMIT"
image = "ghcr.io/distr-sh/distr-controller-contrib/opentofu-controller"

[tasks.go-tidy]
run = "go mod tidy"

[tasks."opentofu:build"]
run = 'go build -ldflags="{{vars.ldflags}}" -o dist/opentofu-controller ./cmd/controller/opentofu'
depends = ["go-tidy"]
description = "Build the OpenTofu controller into dist/"

[tasks."opentofu:run"]
run = 'go run -ldflags="{{vars.ldflags}}" ./cmd/controller/opentofu run'
depends = ["go-tidy"]
description = """
Run the OpenTofu controller against the configuration of an example in examples/opentofu/, without a module package:
"EXAMPLE=hello-world mise run opentofu:run". State, plans, status and providers end up in .data/<example>.
"""
env = { INSTANCE_NAME = "local-dev", RECONCILE_INTERVAL = "1m", DATA_DIR = ".data/{{env.EXAMPLE}}", WORKING_DIR = "examples/opentofu/{{env.EXAMPLE}}" }

[tasks."lint:go"]
run = "golangci-lint run"
depends = ["go-tidy"]

[tasks."opentofu:lint:tofu"]
run = "hack/lint-tofu.sh"
description = "Check formatting, validate and tflint every example"

[tasks."opentofu:lint:chart"]
run = "hack/lint-chart.sh"
description = "Lint the chart of every example and validate the rendered manifests with kubeconform"

[tasks."lint:dprint"]
run = "dprint check"
description = "Check the formatting of the YAML, TOML, Markdown and Dockerfiles"

[tasks."lint:renovate-config"]
run = "npx --yes --package renovate@latest renovate-config-validator"
sources = ["renovate.json"]

[tasks.lint]
run = { tasks = ["lint:go", "lint:dprint", "opentofu:lint:tofu", "opentofu:lint:chart"] }

[tasks."test:go"]
run = "go test ./..."
depends = ["go-tidy"]
description = "Run the Go tests, including the OpenTofu integration test against examples/opentofu/hello-world"

[tasks.test]
run = { tasks = ["test:go"] }

[tasks."format:go"]
run = "golangci-lint run --fix"

[tasks."format:dprint"]
run = "dprint fmt"
description = "Format the YAML, TOML, Markdown and Dockerfiles"

[tasks."opentofu:format:tofu"]
run = "tofu fmt -recursive examples"

[tasks.format]
run = { tasks = ["format:go", "format:dprint", "opentofu:format:tofu"] }

[tasks."opentofu:lock:tofu"]
run = "hack/lock-tofu.sh"
description = "Update the dependency lock files of all examples for every platform the images are built for"

[tasks."opentofu:docker-build"]
run = "docker build --tag {{vars.image}}:$VERSION --build-arg VERSION=$VERSION --build-arg COMMIT=$COMMIT ."
description = "Build the image of the OpenTofu controller"

[tasks."opentofu:package:module"]
run = "hack/package-module.sh examples/opentofu/$EXAMPLE dist/modules/$EXAMPLE.zip"
description = 'Package an example as an OpenTofu module package: "EXAMPLE=aws-eks mise run opentofu:package:module"'

[tasks."opentofu:push:module"]
run = "cd dist/modules && oras push --artifact-type application/vnd.opentofu.modulepkg {{vars.image}}/modules/$EXAMPLE:$VERSION $EXAMPLE.zip:archive/zip"
depends = ["opentofu:package:module"]
description = 'Push the module package of an example, after "oras login"'

[tasks."opentofu:push:providers"]
run = "hack/push-providers.sh examples/opentofu/$EXAMPLE $PROVIDER_MIRROR"
description = """
Push the locked providers of an example to an OCI provider mirror, after "oras login":
"PROVIDER_MIRROR=registry.example.com/acme/opentofu-providers mise run opentofu:push:providers"
"""
